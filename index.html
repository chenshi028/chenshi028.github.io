<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shi Chen</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5d6d7e;
      --line: #d7dee6;
      --accent: #1769aa;
      --surface: #f6f8fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #ffffff;
      line-height: 1.6;
    }

    main {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0;
    }

    .profile {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 40px;
      align-items: start;
    }

    .profile-photo {
      width: 220px;
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    section {
      border-top: 1px solid var(--line);
      padding-top: 24px;
      margin-top: 24px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      line-height: 1.3;
    }

    p {
      margin: 0;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    @media (max-width: 680px) {
      main {
        width: min(100% - 28px, 520px);
        padding: 36px 0;
      }

      .profile {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .profile-photo {
        width: min(220px, 100%);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="profile">
      <img class="profile-photo" src="assets/photo.jpg" alt="Portrait of Shi Chen">

      <div>
        <h1>Shi Chen</h1>
        <p class="subtitle">I am currently studying artificial intelligence at IIIS, Tsinghua University.</p>

        <section>
          <h2>Research Interests</h2>
          <p>My research interests include AI safety, reinforcement learning, and robotics.</p>
        </section>

        <section>
          <h2>Email</h2>
          <p><a href="mailto:s-chen24@mails.tsinghua.edu.cn">s-chen24@mails.tsinghua.edu.cn</a></p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
